    <!-- Fallback image link for scrapers -->
    <link rel="image_src" href="/og-image.png" />

    <script>
      try {
        var _s = JSON.parse(localStorage.getItem('cracker_store_settings') || '{}');
        var _origin = window.location.origin || '';
        if (_s && _s.shopName) {
          var _title = _s.tagline ? _s.shopName + ' | ' + _s.tagline : _s.shopName + ' | Factory Direct Cracker Store';
          document.title = _title;
          var _ogTitle = document.querySelector("meta[property='og:title']");
          if (_ogTitle) _ogTitle.setAttribute('content', _title);
          var _ogSiteName = document.querySelector("meta[property='og:site_name']");
          if (_ogSiteName) _ogSiteName.setAttribute('content', _s.shopName);
        }
        var _img = (_s && _s.logoUrl) ? _s.logoUrl : '/og-image.png';
        if (_img) {
          var _fullImg = _img.indexOf('http') === 0 ? _img : _origin + (_img.charAt(0) === '/' ? '' : '/') + _img;
          var _ogImg = document.querySelector("meta[property='og:image']");
          if (_ogImg && !_ogImg.getAttribute('content').startsWith('http')) _ogImg.setAttribute('content', _fullImg);
          var _ogSecImg = document.querySelector("meta[property='og:image:secure_url']");
          if (_ogSecImg && !_ogSecImg.getAttribute('content').startsWith('http')) _ogSecImg.setAttribute('content', _fullImg);
          var _twImg = document.querySelector("meta[name='twitter:image']");
          if (_twImg && !_twImg.getAttribute('content').startsWith('http')) _twImg.setAttribute('content', _fullImg);
          var _fav = document.querySelector("link[rel*='icon']");
          if (_fav && _s && _s.logoUrl) _fav.href = _s.logoUrl;
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  </body>
</html>
