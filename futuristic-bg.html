<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic AI Firework Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Deep black / charcoal */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* Example website content to show the middle is clean */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: white;
            text-align: center;
            pointer-events: none; /* Let clicks pass through to canvas if you add interaction */
        }
        h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            background: linear-gradient(90deg, #fff, #ffdd88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            color: #b0b0b0;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .cta {
            margin-top: 2rem;
            padding: 12px 32px;
            border: 1px solid rgba(255, 221, 136, 0.4);
            background: rgba(20, 20, 20, 0.6);
            color: #ffdd88;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .cta:hover {
            background: rgba(255, 221, 136, 0.1);
            box-shadow: 0 0 20px rgba(255, 221, 136, 0.2);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="content">
        <h1>INTELLIGENCE ILLUMINATED</h1>
        <p>Empowering the next generation of AI-driven digital experiences. The perfect blend of tradition, celebration, and futuristic technology.</p>
        <button class="cta">Discover The Future</button>
    </div>

    <!-- Three.js for WebGL Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Subtle atmospheric depth
        scene.fog = new THREE.FogExp2(0x050505, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 120;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 1. Ambient Particles (AI Nodes / Zero Gravity)
        const particleCount = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];
        
        for (let i = 0; i < particleCount; i++) {
            // Spread particles across a wide area
            positions[i * 3] = (Math.random() - 0.5) * 500; // x
            positions[i * 3 + 1] = (Math.random() - 0.5) * 500; // y
            positions[i * 3 + 2] = (Math.random() - 0.5) * 400; // z
            
            velocities.push({
                x: (Math.random() - 0.5) * 0.05,
                y: Math.random() * 0.08 + 0.02, // Antigravity - slowly floating upwards
                z: (Math.random() - 0.5) * 0.05
            });
        }
        
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        // Custom circular glowing texture for particles
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.2, 'rgba(255,200,100,0.8)'); // Warm gold/amber
        gradient.addColorStop(0.5, 'rgba(255,150,50,0.2)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 32, 32);
        const particleTexture = new THREE.CanvasTexture(canvas);

        const material = new THREE.PointsMaterial({
            size: 1.5,
            map: particleTexture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.6,
            color: 0xffdd88
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 2. AI Network Data Streams (Subtle connecting lines)
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending
        });
        const lineGeometry = new THREE.BufferGeometry();
        const maxLines = 800;
        const linePositions = new Float32Array(maxLines * 6); 
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(linesMesh);

        // 3. Futuristic Fireworks System
        const fireworks = [];
        const fireworkColors = [0xffaa00, 0xffdd88, 0x00aaff]; // Gold, warm white, electric blue
        
        function createFirework() {
            // Constrain fireworks to left and right edges (avoiding the center 40-50%)
            const isLeft = Math.random() > 0.5;
            // X position: far left or far right
            const startX = isLeft ? -150 - Math.random() * 80 : 150 + Math.random() * 80;
            const startY = -150;
            
            const fireworkGroup = new THREE.Group();
            fireworkGroup.position.set(startX, startY, (Math.random() - 0.5) * 100);
            
            // Trail particle (launches upwards)
            const trailGeo = new THREE.BufferGeometry();
            trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3));
            const trailMat = new THREE.PointsMaterial({
                size: 3, 
                map: particleTexture, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false, 
                transparent: true, 
                color: 0xffddaa
            });
            const trail = new THREE.Points(trailGeo, trailMat);
            fireworkGroup.add(trail);
            scene.add(fireworkGroup);
            
            fireworks.push({
                group: fireworkGroup,
                phase: 'launch',
                velocity: { 
                    x: (isLeft ? 1 : -1) * (Math.random() * 0.4 + 0.1), // Arc slightly inwards
                    y: Math.random() * 1.5 + 1.5, 
                    z: (Math.random() - 0.5) * 0.5 
                },
                life: 1.0,
                explodeParticles: null,
                targetY: Math.random() * 80 + 30 // Explode high up
            });
        }

        function explode(firework) {
            firework.phase = 'explode';
            firework.group.remove(firework.group.children[0]); // Remove the launching trail
            
            const fwParticleCount = 300;
            const fwGeo = new THREE.BufferGeometry();
            const fwPos = new Float32Array(fwParticleCount * 3);
            const fwVels = [];
            
            for(let i=0; i<fwParticleCount; i++) {
                fwPos[i*3] = 0; fwPos[i*3+1] = 0; fwPos[i*3+2] = 0;
                
                // Cinematic spherical burst
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                // Mix of fast outer particles and slow inner particles
                const speed = (Math.random() * Math.random()) * 1.5 + 0.2; 
                
                fwVels.push({
                    x: Math.sin(phi) * Math.cos(theta) * speed,
                    y: Math.sin(phi) * Math.sin(theta) * speed,
                    z: Math.cos(phi) * speed
                });
            }
            
            fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
            
            // Pick a random premium color for this burst
            const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            
            const fwMat = new THREE.PointsMaterial({
                size: 2, 
                map: particleTexture, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false, 
                transparent: true, 
                color: color,
                opacity: 0.9
            });
            
            const fwPoints = new THREE.Points(fwGeo, fwMat);
            firework.group.add(fwPoints);
            firework.explodeVels = fwVels;
            firework.explodeGeo = fwGeo;
        }

        // 4. Main Animation Loop
        let clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Slowly rotate the entire ambient field for cinematic parallax
            particles.rotation.y = Math.sin(time * 0.05) * 0.1;
            particles.rotation.x = Math.cos(time * 0.03) * 0.05;

            // Move ambient particles (Zero gravity float)
            const positions = particles.geometry.attributes.position.array;
            let lineIdx = 0;
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += velocities[i].x;
                positions[i * 3 + 1] += velocities[i].y;
                positions[i * 3 + 2] += velocities[i].z;
                
                // Seamless wrap around
                if (positions[i * 3 + 1] > 250) positions[i * 3 + 1] = -250;
                
                // Antigravity micro-wobble
                velocities[i].x += (Math.random() - 0.5) * 0.003;
                velocities[i].z += (Math.random() - 0.5) * 0.003;
                
                // Speed limits to keep motion elegant and slow
                velocities[i].x = Math.max(-0.1, Math.min(0.1, velocities[i].x));
                velocities[i].z = Math.max(-0.1, Math.min(0.1, velocities[i].z));

                // AI Neural Network connection logic
                // Check a small subset of particles to draw connecting lines if they are close
                if (i % 8 === 0 && lineIdx < maxLines * 6) {
                    for (let j = i + 1; j < particleCount; j+= 25) {
                        const dx = positions[i*3] - positions[j*3];
                        const dy = positions[i*3+1] - positions[j*3+1];
                        const dz = positions[i*3+2] - positions[j*3+2];
                        const distSq = dx*dx + dy*dy + dz*dz;
                        
                        // If particles are close, draw a line connecting them
                        if (distSq < 600) {
                            linePositions[lineIdx++] = positions[i*3];
                            linePositions[lineIdx++] = positions[i*3+1];
                            linePositions[lineIdx++] = positions[i*3+2];
                            linePositions[lineIdx++] = positions[j*3];
                            linePositions[lineIdx++] = positions[j*3+1];
                            linePositions[lineIdx++] = positions[j*3+2];
                            if (lineIdx >= maxLines * 6) break;
                        }
                    }
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            
            // Clear any unused line segments
            for(let i = lineIdx; i < maxLines * 6; i++) {
                linePositions[i] = 0;
            }
            linesMesh.geometry.attributes.position.needsUpdate = true;

            // Handle Fireworks Spawning and Physics
            // Adjust probability to control how frequent fireworks are
            if (Math.random() < 0.015 && fireworks.length < 6) {
                createFirework();
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                if (fw.phase === 'launch') {
                    // Launch phase physics
                    fw.group.position.x += fw.velocity.x;
                    fw.group.position.y += fw.velocity.y;
                    fw.group.position.z += fw.velocity.z;
                    
                    // Sine wave wobble to simulate energy trail
                    fw.velocity.x += Math.sin(time * 10 + i) * 0.02;
                    
                    if (fw.group.position.y >= fw.targetY) {
                        explode(fw);
                    }
                } else if (fw.phase === 'explode') {
                    // Explosion expansion and antigravity float
                    const fwPos = fw.explodeGeo.attributes.position.array;
                    for (let j = 0; j < fwPos.length / 3; j++) {
                        fwPos[j*3] += fw.explodeVels[j].x;
                        fwPos[j*3+1] += fw.explodeVels[j].y;
                        fwPos[j*3+2] += fw.explodeVels[j].z;
                        
                        // Air resistance / Drag (particles slow down over time)
                        fw.explodeVels[j].x *= 0.94;
                        fw.explodeVels[j].z *= 0.94;
                        
                        // Antigravity effect: Instead of falling down heavily, 
                        // they slow down and gently float upwards or stay suspended
                        fw.explodeVels[j].y *= 0.92; 
                        fw.explodeVels[j].y += 0.01; // Constant gentle upward lift
                    }
                    fw.explodeGeo.attributes.position.needsUpdate = true;
                    
                    // Fade out
                    fw.life -= 0.003;
                    fw.group.children[0].material.opacity = Math.max(0, fw.life);
                    
                    // Clean up dead fireworks
                    if (fw.life <= 0) {
                        scene.remove(fw.group);
                        fireworks.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Window Resizing smoothly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
